<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://unpkg.com; style-src 'unsafe-inline' https://unpkg.com; img-src data: https://tile.openstreetmap.org; connect-src https://router.project-osrm.org; base-uri 'none'; form-action 'none'">
<title>Mapa de FoodExpress</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
html,body{height:100%;margin:0;font-family:system-ui,sans-serif;color:#262626;background:#f5f3ef}
body{display:flex;flex-direction:column}#map{flex:1;min-height:140px}
#status{padding:12px 16px;background:white;font-size:14px;line-height:1.4;border-top:1px solid #ddd}
.pin{display:grid;place-items:center;border:3px solid white;border-radius:50%;background:#c62847;color:white;font-weight:800;box-shadow:0 2px 8px #555;font-size:16px}
.origin{background:#22634b}.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Mapa interactivo de entrega"></div>
<div id="status" role="status" aria-live="polite">Cargando mapa… Si no aparece, comprueba Internet y pulsa «Recargar mapa».</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
let map, selectedMarker;
const statusBox = document.getElementById('status');
function validPoint(p) {
  return Array.isArray(p) && p.length === 2 && p.every(Number.isFinite) &&
    Math.abs(p[0]) <= 85.05112878 && Math.abs(p[1]) <= 180;
}
function pin(label, origin) {
  return L.divIcon({className: 'pin' + (origin ? ' origin' : ''), html: label,
    iconSize: [30,30], iconAnchor: [15,15]});
}
function reportPoint(point) {
  const p = [point.lat, ((point.lng + 180) % 360 + 360) % 360 - 180];
  if (!validPoint(p)) return;
  selectedMarker.setLatLng(p);
  statusBox.textContent = 'Punto elegido: ' + p[0].toFixed(5) + ', ' + p[1].toFixed(5) + '. Confirma para guardarlo.';
  window.location.href = 'foodexpress://point?lat=' + p[0] + '&lng=' + p[1];
}
window.initMap = function(config) {
  if (map) return;
  if (!window.L) {
    statusBox.textContent = 'No se pudo cargar el mapa. Revisa Internet y pulsa «Recargar mapa».';
    return;
  }
  const point = validPoint(config.point) ? config.point : null;
  const origin = validPoint(config.origin) ? config.origin : null;
  map = L.map('map').setView(point || origin || [-12.0464, -77.0428], point ? 16 : 12);
  if (window.ResizeObserver) new ResizeObserver(function() { map.invalidateSize(); }).observe(document.getElementById('map'));
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, minZoom: 2,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).on('tileerror', function() {
    statusBox.textContent = 'No se pudieron cargar algunas calles. Revisa Internet y recarga el mapa.';
  }).addTo(map);
  if (config.picking) {
    statusBox.textContent = point ? 'Puedes mover el pin o confirmar la ubicación guardada.' :
      'Toca para colocar el pin. La vista inicial es Lima; desplaza el mapa si estás en otra ciudad.';
    if (point) selectedMarker = L.marker(point, {icon: pin('●', false), draggable: true}).addTo(map);
    map.on('click', function(event) {
      if (!selectedMarker) {
        selectedMarker = L.marker(event.latlng, {icon: pin('●', false), draggable: true}).addTo(map);
        selectedMarker.on('dragend', function() { reportPoint(selectedMarker.getLatLng()); });
      }
      reportPoint(event.latlng);
    });
    if (selectedMarker) selectedMarker.on('dragend', function() { reportPoint(selectedMarker.getLatLng()); });
    return;
  }
  if (origin) L.marker(origin, {icon: pin('R', true)}).addTo(map).bindPopup('Restaurante · punto de recogida');
  if (point) L.marker(point, {icon: pin('E', false)}).addTo(map).bindPopup('Entrega · ubicación elegida');
  if (!point || !origin) {
    statusBox.textContent = !point ? 'Este pedido no tiene una ubicación de entrega guardada.' :
      'La entrega está marcada, pero este pedido no tiene la ubicación del restaurante. No se puede calcular la ruta.';
    return;
  }
  map.fitBounds([origin, point], {padding: [36,36], maxZoom: 16});
  loadRoute(origin, point);
};
async function loadRoute(origin, point) {
  statusBox.textContent = 'Calculando ruta por calles…';
  const controller = new AbortController();
  const timeout = setTimeout(function() { controller.abort(); }, 15000);
  try {
    const coordinates = origin[1] + ',' + origin[0] + ';' + point[1] + ',' + point[0];
    const response = await fetch('https://router.project-osrm.org/route/v1/driving/' + coordinates +
      '?overview=full&geometries=geojson&radiuses=200;200', {signal: controller.signal});
    if (!response.ok) throw new Error('network');
    const data = await response.json();
    const route = data.routes && data.routes[0];
    if (data.code !== 'Ok' || !route || !route.geometry || route.geometry.type !== 'LineString' ||
        !Number.isFinite(route.distance) || !Number.isFinite(route.duration) ||
        !Array.isArray(route.geometry.coordinates) || route.geometry.coordinates.length < 2 ||
        !route.geometry.coordinates.every(function(p) { return validPoint([p[1],p[0]]); })) throw new Error('route');
    const line = L.geoJSON(route.geometry, {style: {color: '#c62847', weight: 6, opacity: 0.85}}).addTo(map);
    const bounds = line.getBounds().extend(origin).extend(point);
    map.fitBounds(bounds, {padding: [36,36], maxZoom: 16});
    statusBox.textContent = (route.distance / 1000).toFixed(1) + ' km · ' + Math.max(1, Math.round(route.duration / 60)) +
      ' min de conducción aprox. · Ruta: OSRM. No incluye preparación ni tráfico en vivo.';
  } catch (error) {
    statusBox.textContent = 'No se pudo calcular una ruta por calles. Revisa Internet o prueba otra ubicación cercana a una vía. Los puntos siguen visibles; puedes recargar para reintentar.';
  } finally {
    clearTimeout(timeout);
  }
}
</script>
</body>
</html>
